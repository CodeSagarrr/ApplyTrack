services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./Backend
    environment:
      MONGODB_URI: mongodb://mongo:27017/ApplyTrackData
    env_file: ./Backend/.env
    ports:
      - "8080:8080"


  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: http://localhost:8080

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  mongo-data:
  